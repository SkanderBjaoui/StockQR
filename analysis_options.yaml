include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # Services take their collaborators as public named parameters
    # (users:, session:, ...) while storing them in private fields.
    prefer_initializing_formals: false
